name: Android APK (teste)
# Gera um APK de TESTE (debug) do app empacotado com Capacitor. Não publica nada em loja nem em produção.
on:
  workflow_dispatch:
  push:
    branches: [capacitor-android]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Criar projeto Android (gerado na hora; não fica versionado)
        run: |
          npx cap add android
          f=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' "$f"
          npx cap sync android
      - name: Compilar APK debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: condor-validade-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
