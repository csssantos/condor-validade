name: Android APK (teste)
# Gera um APK de TESTE (assinado com a chave de debug) que abre https://app.usebipi.com dentro de um app Android,
# com notificações push nativas (FCM) que chegam mesmo com o app fechado.
# Rodar: Actions → "Android APK (teste)" → Run workflow → baixar o arquivo em Artifacts. Não publica nada em loja.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Projeto Android em pasta separada (não mexe no package.json do app)
        run: |
          mkdir -p /tmp/apk/www && cd /tmp/apk
          printf '<!doctype html><meta charset="utf-8"><title>Bipi</title>' > www/index.html
          cp "$GITHUB_WORKSPACE/capacitor.config.json" .
          cp -r "$GITHUB_WORKSPACE/android-icones" "$GITHUB_WORKSPACE/android-config" .
          npm init -y >/dev/null
          npm install --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/push-notifications@6
          npx cap add android
      - name: Permissões, Firebase, ícone e nome
        working-directory: /tmp/apk
        run: |
          f=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' "$f"
          cp android-config/google-services.json android/app/google-services.json
          res=android/app/src/main/res
          rm -f $res/mipmap-anydpi-v26/ic_launcher.xml $res/mipmap-anydpi-v26/ic_launcher_round.xml
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do cp android-icones/mipmap-$d/*.png $res/mipmap-$d/; done
          grep -q "google-services" android/build.gradle android/app/build.gradle || { echo "AVISO: plugin google-services não encontrado nos gradle"; }
      - name: Sincronizar e compilar
        working-directory: /tmp/apk
        run: |
          npx cap sync android
          cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: bipi-android-apk
          path: /tmp/apk/android/app/build/outputs/apk/debug/app-debug.apk
