name: Android APK (teste)
# Gera um APK de TESTE (assinado com a chave de debug) que abre https://app.usebipi.com dentro de um app Android.
# Não publica nada em loja. Rodar: Actions → "Android APK (teste)" → Run workflow → baixar o arquivo em Artifacts.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Instalar Capacitor (só para o APK; não mexe no package.json do app)
        run: |
          mkdir -p /tmp/cap && cd /tmp/cap && npm init -y >/dev/null
          npm install --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          echo "/tmp/cap/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Criar projeto Android
        run: |
          mkdir -p www && printf '<!doctype html><meta charset="utf-8"><title>Bipi</title>' > www/index.html
          ln -s /tmp/cap/node_modules node_modules
          cap add android
      - name: Permissões, ícone e nome
        run: |
          f=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' "$f"
          res=android/app/src/main/res
          rm -f $res/mipmap-anydpi-v26/ic_launcher.xml $res/mipmap-anydpi-v26/ic_launcher_round.xml
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do cp android-icones/mipmap-$d/*.png $res/mipmap-$d/; done
      - name: Sincronizar e compilar
        run: |
          cap sync android
          cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: bipi-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
