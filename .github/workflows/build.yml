name: Build (verificação)
# Só compila o app para conferir que não há erro. Não publica nada.
on:
  workflow_dispatch:
  push:
    branches: [mais-refeito]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: npm run build
