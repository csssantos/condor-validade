    <path d="M326 150 L332 156 L343 143" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <circle cx="311" cy="188" r="15" fill="#fff" stroke="#7DB4F0" stroke-width="3"/>
