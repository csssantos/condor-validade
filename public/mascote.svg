  <g fill="#fff"><circle cx="128" cy="196" r="17"/><circle cx="152" cy="216" r="17"/><circle cx="176" cy="224" r="17"/><circle cx="200" cy="228" r="17"/><circle cx="224" cy="224" r="17"/><circle cx="248" cy="216" r="17"/><circle cx="272" cy="196" r="17"/></g>
