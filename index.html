<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>Condor · Alerta de Validade</title>
    <meta name="description" content="Controle de validade, alertas e baixas de produtos da Condor Supermercados." />

    <!-- PWA / instalação como app -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0B4F9E" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Alerta Validade" />
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
        <div id="root"><!-- abertura estática: aparece na hora, antes do app carregar; o React troca por conteúdo real -->
      <style>
        #abertura{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 85% at 50% 0%,#1B6FD1 0%,#0B4F9E 42%,#061C3A 100%)}
        #abertura .caixa{width:104px;height:104px;border-radius:30px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 18px 40px -10px rgba(0,0,0,.5);animation:ab-pulsa 1.6s ease-in-out infinite}
        #abertura img{width:64px;height:64px;border-radius:14px}
        #abertura .anel{position:absolute;width:110px;height:110px;border-radius:50%;border:1px solid rgba(255,255,255,.4);animation:ab-onda 2.4s ease-out infinite}
        #abertura .anel:nth-child(2){animation-delay:1.2s}
        @keyframes ab-pulsa{50%{transform:scale(1.06)}}
        @keyframes ab-onda{from{transform:scale(.8);opacity:.6}to{transform:scale(2.4);opacity:0}}
        @media (prefers-reduced-motion:reduce){#abertura *{animation:none!important}}
      </style>
      <div id="abertura" role="status" aria-label="Carregando"><span class="anel"></span><span class="anel"></span><div class="caixa"><img src="/icon-192.png" alt="Condor" /></div></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
