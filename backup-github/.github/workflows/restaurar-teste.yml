# TESTE DE RESTAURAÇÃO do backup (copiar para o repositório PRIVADO csssantos/condor-validade-backup).
# Backup que nunca foi restaurado não é backup garantido. Este teste pega o arquivo MAIS NOVO de backups/,
# abre (descriptografa), restaura num Postgres 17 descartável dentro do próprio GitHub e confere:
#   - as tabelas principais voltaram com dados (lojas, cargos, usuarios, catalogo, produtos...);
#   - o RLS (segurança por linha) e as policies voltaram;
#   - as contagens batem (com folga) com o banco de verdade.
# NÃO escreve nada no banco de produção (só lê as contagens, para comparar). Roda sozinho no dia 1 de cada mês
# e na hora com "Run workflow". Secrets (os mesmos do backup): SUPABASE_DB_URL e BACKUP_PASSPHRASE.
# Limite honesto: o banco do teste é um Postgres comum, sem as extensões do Supabase (pg_cron, pg_net, vault);
# erros por causa delas são esperados e listados no resumo. O que importa é: os DADOS e as POLICIES voltaram.
name: Teste de restauração do backup

on:
  schedule:
    - cron: "30 5 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restaurar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      pg:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: teste
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGPASSWORD: teste
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Instalar o cliente do Postgres 17
        run: |
          sudo apt-get -o Acquire::Retries=5 update -qq
          sudo apt-get -o Acquire::Retries=5 install -y -qq curl ca-certificates gnupg lsb-release
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL --retry 6 --retry-all-errors --retry-delay 5 -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get -o Acquire::Retries=5 update -qq
          sudo apt-get -o Acquire::Retries=5 install -y -qq postgresql-client-17

      - name: Abrir o backup mais novo
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          [ -n "$BACKUP_PASSPHRASE" ] || { echo "Falta o secret BACKUP_PASSPHRASE"; exit 1; }
          ARQ=$(ls -1 backups/*.sql.gz.gpg | sort | tail -n 1)
          echo "ARQ=$ARQ" >> "$GITHUB_ENV"
          umask 077
          printf '%s' "$BACKUP_PASSPHRASE" > "$RUNNER_TEMP/pp"
          gpg --batch --pinentry-mode loopback --passphrase-file "$RUNNER_TEMP/pp" -d "$ARQ" | gunzip > "$RUNNER_TEMP/dump.sql"
          shred -u "$RUNNER_TEMP/pp"
          echo "Backup aberto: $ARQ ($(stat -c %s "$RUNNER_TEMP/dump.sql") bytes de SQL)"

      - name: Preparar o banco descartável (papéis e schemas que o Supabase já traz)
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          do $$ declare r text; begin
            foreach r in array array['anon','authenticated','service_role','authenticator','supabase_auth_admin','supabase_storage_admin','supabase_admin','dashboard_user','pgbouncer','supabase_realtime_admin','supabase_read_only_user']
            loop
              if not exists (select 1 from pg_roles where rolname = r) then execute format('create role %I nologin', r); end if;
            end loop;
          end $$;
          create schema if not exists extensions;
          create extension if not exists pgcrypto with schema extensions;
          create extension if not exists "uuid-ossp" with schema extensions;
          SQL

      - name: Restaurar
        run: |
          # sem ON_ERROR_STOP de propósito: erros de extensões do Supabase são esperados; o que vale são as conferências abaixo
          psql -v ON_ERROR_STOP=0 -f "$RUNNER_TEMP/dump.sql" > "$RUNNER_TEMP/restauracao.log" 2> "$RUNNER_TEMP/erros.log" || true
          echo "Linhas de erro: $(grep -c 'ERROR' "$RUNNER_TEMP/erros.log" || true)"

      - name: Conferir (dados, segurança e comparação com o banco de verdade)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -uo pipefail
          FALHAS=0
          {
            echo "## Teste de restauração do backup"
            echo "Arquivo restaurado: \`$ARQ\`"
            echo
            echo "| Tabela | Restaurado | Banco de verdade | Resultado |"
            echo "|---|---:|---:|---|"
          } > "$GITHUB_STEP_SUMMARY"
          for T in lojas cargos usuarios catalogo produtos historico auditoria; do
            R=$(psql -tA -c "select count(*) from public.$T" 2>/dev/null || echo ERRO)
            V=$(psql "$SUPABASE_DB_URL" -tA -c "select count(*) from public.$T" 2>/dev/null || echo "?")
            RES="ok"
            if [ "$R" = "ERRO" ]; then RES="FALTOU A TABELA"; FALHAS=$((FALHAS+1));
            elif [ "$T" = "lojas" ] || [ "$T" = "cargos" ] || [ "$T" = "usuarios" ] || [ "$T" = "catalogo" ]; then
              if [ "$R" -eq 0 ]; then RES="VAZIA"; FALHAS=$((FALHAS+1)); fi
            fi
            # compara com o banco de verdade (folga de 10% + 5: o backup tem horas de diferença)
            if [ "$R" != "ERRO" ] && [ "$V" != "?" ] && [ "$V" -gt 20 ]; then
              MIN=$(( V * 9 / 10 - 5 ))
              if [ "$R" -lt "$MIN" ]; then RES="MENOS DADOS QUE O BANCO"; FALHAS=$((FALHAS+1)); fi
            fi
            echo "| $T | $R | $V | $RES |" >> "$GITHUB_STEP_SUMMARY"
          done
          RLS=$(psql -tA -c "select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relkind='r' and c.relrowsecurity")
          SEMRLS=$(psql -tA -c "select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relkind='r' and not c.relrowsecurity")
          POL=$(psql -tA -c "select count(*) from pg_policies where schemaname='public'")
          FUN=$(psql -tA -c "select count(*) from pg_proc where pronamespace='public'::regnamespace")
          TRG=$(psql -tA -c "select count(*) from pg_trigger t join pg_class c on c.oid=t.tgrelid join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and not t.tgisinternal")
          {
            echo
            echo "- Tabelas com RLS ligado: **$RLS** (sem RLS: **$SEMRLS**)"
            echo "- Policies restauradas: **$POL**"
            echo "- Funções restauradas: **$FUN** — triggers: **$TRG**"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$POL" -gt 20 ] || { echo "- ❌ Poucas policies: a segurança por linha não voltou" >> "$GITHUB_STEP_SUMMARY"; FALHAS=$((FALHAS+1)); }
          [ "$SEMRLS" -eq 0 ] || { echo "- ❌ Há tabelas sem RLS depois da restauração" >> "$GITHUB_STEP_SUMMARY"; FALHAS=$((FALHAS+1)); }
          {
            echo
            echo "### Erros distintos da restauração (os de pg_cron, pg_net e vault são esperados)"
            echo '```'
            grep 'ERROR' "$RUNNER_TEMP/erros.log" | sed 's/[0-9]\{2,\}/N/g' | sort | uniq -c | sort -rn | head -n 25
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$FALHAS" -gt 0 ]; then echo "❌ $FALHAS conferência(s) falharam" | tee -a "$GITHUB_STEP_SUMMARY"; exit 1; fi
          echo "✅ Backup restaurado e conferido" | tee -a "$GITHUB_STEP_SUMMARY"
