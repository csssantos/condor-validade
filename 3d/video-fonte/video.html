const sc=document.createElement('canvas');sc.width=1024;sc.height=2048;const sx=sc.getContext('2d');
const SEQ=[[0,'home_s00'],[6.55,'exp0'],[8.2,'exp1'],[9.5,'exp2'],[10.7,'exp3'],[11.3,'exp4'],[12.3,'exp5'],[14.1,'home_s00'],[15.9,'setores'],[17.2,'setor_s00'],[19.9,{scroll:'setor',n:40,d:2.0}],[23.7,'rondas'],[25.0,'rpainel'],[32.0,'home_s00'],[33.2,'detalhe'],[36.4,'mais'],[37.6,{scroll:'rel',n:24,d:1.4}]];
// toques: [tempo,x,y] (coordenadas da tela 390x844) ; arrastos: [t0,t1,x,y0,y1]
const TAPS=[[6.2,195,788],[8.0,195,238],[9.3,195,318],[10.4,149,525],[12.0,111,483],[13.7,292,693],[15.6,125,818],[16.9,158,372],[18.2,84,240],[18.7,195,240],[19.2,306,240],[23.4,265,818],[24.7,160,386],[31.7,54,818],[32.5,204,489],[34.2,150,388],[36.0,336,818],[37.2,274,496],[38.6,135,624]];
const DRAGS=[[11.0,11.35,195,650,420],[12.7,13.1,195,640,420],[19.9,21.9,195,640,300],[37.7,39.0,195,640,300]];
const ACT=[[5.9,14.4],[15.3,22.9],[23.2,25.8],[31.2,39.3]];
// waypoints do dedo
const WP=[];TAPS.forEach(a=>WP.push({a:a[0],d:a[0]+.12,x0:a[1],y0:a[2],x1:a[1],y1:a[2],tap:1}));DRAGS.forEach(a=>WP.push({a:a[0],d:a[1],x0:a[2],y0:a[3],x1:a[2],y1:a[4],tap:0}));WP.sort((p,q)=>p.a-q.a);
function drawScreen(t){
  sx.fillStyle='#fff';sx.fillRect(0,0,1024,2048);
  let i=0;for(let k=0;k<SEQ.length;k++)if(t>=SEQ[k][0])i=k;
  const img=(st,tt)=>{ if(typeof st==='string')return [[st,1]]; const p=eio(seg(tt,SEQ[i][0],SEQ[i][0]+st.d)),a=Math.round(p*(st.n-1)); return [[st.scroll+'_s'+String(a).padStart(2,'0'),1]]};
  const draw=(list,alpha,zoom)=>list.forEach(([n,w])=>{sx.globalAlpha=alpha*w;sx.save();sx.translate(512,1024);sx.scale(zoom,zoom);sx.drawImage(IM[n],-512,-1024,1024,2048);sx.restore()});
  if(i>0){draw(img(SEQ[i-1][1],1e9),1,1)}
  const f=seg(t,SEQ[i][0],SEQ[i][0]+.28);
  draw(img(SEQ[i][1],t),i===0?1:f,1+(1-eo(f))*.03); sx.globalAlpha=1;
  // ondulações dos toques
  TAPS.forEach(a=>{const d=t-a[0]; if(d>-.02&&d<.6){const k=clamp(d/.6),r=(10+34*eo(k))*2.63;sx.strokeStyle=`rgba(255,255,255,${.85*(1-k)})`;sx.lineWidth=7;sx.beginPath();sx.arc(a[1]*2.6256,a[2]*2.4265,r,0,6.283);sx.stroke();sx.fillStyle=`rgba(11,79,158,${.35*(1-k)})`;sx.fill()}});
}
// ---------- falas ----------
function mouthAt(t){let m=0;for(const s of SYL){if(t>=s[0]&&t<s[0]+s[1]){const k=(t-s[0])/s[1];m=Math.max(m,Math.sin(Math.PI*k)*(.55+.12*s[2]))}}return m}
const talking=t=>TALK.some(a=>t>=a[0]&&t<=a[1]);
// ---------- câmera ----------
const KEYS=[[0,0],[5.2,0],[6.0,1],[13.8,1],[14.6,0],[15.2,0],[15.9,1],[22.6,1],[23.2,0],[23.4,1],[25.8,1],[26.3,0],[30.8,0],[31.4,1],[38.6,1],[39.3,0]];
function mode(t){for(let i=0;i<KEYS.length-1;i++){if(t<KEYS[i+1][0])return lerp(KEYS[i][1],KEYS[i+1][1],ss(seg(t,KEYS[i][0],KEYS[i+1][0])))}return KEYS[KEYS.length-1][1]}
const PH={t:[.12,.66,.62],rx:-.08,ry:0,s:1.1};
let B,rigM;
const bin=Uint8Array.from(atob(BIPI_GLB),c=>c.charCodeAt(0)).buffer;
Promise.all([Bipi3D.create($('gl'),bin),...loads]).then(([b])=>{B=b;window.ready=true});
function finger(t){ // posição do dedo (u,v da tela em -1..1) e altura
  let act=0;for(const a of ACT){const w=ss(seg(t,a[0],a[0]+.35))*(1-ss(seg(t,a[1]-.3,a[1])));act=Math.max(act,w)}
  if(act<=0)return null;
  let idx=-1;for(let k=0;k<WP.length;k++)if(WP[k].a<=t)idx=k;
  const toUV=(x,y)=>[(x/390-.5)*2,(.5-y/844)*2];
  let u,v,lift=.2,press=0;
  const first=WP.find(w=>w.a>=ACT.find(a=>t>=a[0]-.01&&t<=a[1]+.01)?.[0]);
  if(idx<0||WP[idx].a<ACT.find(a=>t>=a[0]-.01&&t<=a[1]+.01)?.[0]-.001){
    const w=first||WP[0];const p=toUV(w.x0,w.y0);const k=ss(seg(t,ACT.find(a=>t>=a[0]-.01&&t<=a[1]+.01)[0],w.a-.25));u=lerp(-1.5,p[0],k);v=lerp(-.2,p[1],k);lift=.22;
  } else {
    const w=WP[idx], nx=WP[idx+1];
    if(t<=w.d){const k=eio(seg(t,w.a,w.d));const p0=toUV(w.x0,w.y0),p1=toUV(w.x1,w.y1);u=lerp(p0[0],p1[0],k);v=lerp(p0[1],p1[1],k);press=w.tap?Math.exp(-Math.pow((t-w.a)/.07,2)):1;lift=.02*(1-press)}
    else {
      const p0=toUV(w.x1,w.y1);let p1=p0;let down=0;let up=ss(seg(t,w.d,w.d+.22));
      if(nx&&nx.a<=ACT.find(a=>t>=a[0]-.01&&t<=a[1]+.01)[1]+.01&&nx.a-w.d<3){p1=toUV(nx.x0,nx.y0);const k=ss(seg(t,w.d+.05,nx.a-.2));u=lerp(p0[0],p1[0],k);v=lerp(p0[1],p1[1],k);down=1-ss(seg(t,nx.a-.22,nx.a));}
      else {u=p0[0];v=p0[1];down=1}
      lift=.02+.2*Math.min(up,down);
    }
  }
  return {u,v,lift,act};
}
window.frame=function(t){
  $('circ').style.transform=`translate(${Math.sin(t*.5)*30}px,${Math.cos(t*.4)*24}px) scale(${1+Math.sin(t*.6)*.03})`;
  bubs.forEach(b=>{const y=1980-((t*b.sp+b.ph*200)%2100);b.d.style.transform=`translate(${b.x+Math.sin(t+b.ph)*24}px,${y}px)`;});
  // legenda
  let ci=-1;CAPS.forEach((c,i)=>{if(t>=c[0])ci=i});const c=CAPS[ci]; setCap(ci>=0&&t<c[1]+.35?ci:-1);
  if(ci>=0){const lt=t-c[0];const sp=$('cap').children;for(let k=0;k<sp.length;k++){const p=ob(seg(lt,.05+k*.07,.4+k*.07));sp[k].style.opacity=clamp(seg(lt,.02+k*.07,.3+k*.07));sp[k].style.transform=`translateY(${(1-p)*36}px)`}$('cap').style.opacity=1-seg(t,c[1]-.15,c[1]+.35)}
  $('brand').style.opacity=t>39.4?0:.9;
  // sobreposições
  const ov=(el,a,b,fo)=>{const i=seg(t,a,a+.3),o=1-seg(t,fo,fo+.3);el.style.opacity=Math.min(i,o);const p=ob(seg(t,a,a+.45));el.style.transform=`translateY(${(1-p)*140}px) scale(${.6+.4*p})`};
  ov($('b1'),27.5,0,29.5);ov($('b2'),28.7,0,29.6);ov($('pdf'),38.6,0,39.4);
  $('s6').style.opacity=seg(t,40.0,40.5);
  $('lg0').style.transform=`translateY(${(1-ob(seg(t,40.0,40.7)))*80}px)`;$('lg2').style.opacity=seg(t,40.5,40.9);$('lg3').style.opacity=seg(t,41.2,41.6);
  if(!B)return; const M=B.M;
  drawScreen(t);
  const pose={}; const m=mode(t), talk=talking(t), mo=mouthAt(t);
  // ---- raiz do Bipi
  let pos=[0,0,0],scale=1,rotY=Math.sin(t*.7)*.06,phone=null,squash=1,phoneS=PH.s;
  if(t<1.0){const e=ob(seg(t,.0,.9));pos=[0,(1-e)*-5.2,0]}
  if(t>=1.0&&t<1.5){const k=seg(t,1.0,1.5);squash=1-.1*Math.sin(Math.PI*k)}
  // pulos de comemoração
  const jump=(a,b,h)=>(t>a&&t<b)?Math.abs(Math.sin((t-a)/(b-a)*Math.PI))*h:0;
  pos[1]+=jump(13.7,14.5,.55)+jump(30.0,30.9,.3);
  // mergulho no celular e saída pelo topo
  let diving=false;const C0=[.12,.66,.5];
  if(t>=26.0&&t<27.2){diving=true;const k=seg(t,26.0,27.1),up=Math.sin(Math.PI*Math.min(1,k*1.6))*.9*(1-seg(k,.45,1));
    const s=1-.96*ss(seg(k,.3,1));scale=Math.max(.04,s);const c=lerp3([0,1.0,.1],[C0[0],C0[1]+.25,.95],ss(seg(k,0,.55)));const c2=lerp3(c,C0,ss(seg(k,.55,1)));
    pos=[c2[0],c2[1]+up-scale*1.0,c2[2]];phone={pos:[0,0,0],scale:1,rotY:0}; rotY=0}
  if(t>=27.2&&t<29.5){diving=true;scale=.04;pos=[C0[0],C0[1]-.04,C0[2]-.3];phone={pos:[0,0,0],scale:1,rotY:0}}
  if(t>=29.5&&t<30.5){diving=true;const k=seg(t,29.5,30.5),s=Math.max(.04,ob(seg(k,0,.85)));scale=s;const c=lerp3([C0[0],C0[1],C0[2]-.3],[0,1.0,0],ss(k));const arc=Math.sin(Math.PI*seg(k,0,.8))*1.05;
    pos=[c[0],c[1]+arc-scale*1.0,c[2]];phone={pos:[0,0,0],scale:1,rotY:0};rotY=0; if(k>=1)diving=false}
  if(t>=30.5)diving=false;
  const retorno=t>=29.5&&t<30.5;
  // saída: celular guardado
  let phS=phoneS;const out=ss(seg(t,39.4,40.1));phS=phoneS*(1-out);
  
  // ---- celular (segue o Bipi, exceto no mergulho)
  const ph={t:PH.t,rx:PH.rx,ry:PH.ry,s:phS};
  pose.celular={tx:ph.t[0],ty:ph.t[1],tz:ph.t[2],rx:ph.rx,ry:ph.ry,rz:0,s:Math.max(.001,phS)};
  const pp=(p)=>BipiRig.phonePt(M,{t:ph.t,rx:ph.rx,ry:ph.ry},[p[0]*phoneS,p[1]*phoneS,p[2]*phoneS]);
  // ---- braço que segura
  const holdOn=!diving&&t<39.6;
  const polR=[.5,-1,-.15];
  let rR;
  if(diving||retorno){rR=BipiRig.ik('R',[.9,1.95+Math.sin(t*14)*.1,.25],[.6,-1,-.2])}
  else if(t>=39.6){const w=[.88+Math.sin(t*9+1)*.1,1.95+Math.sin(t*9)*.08,.3];rR=BipiRig.ik('R',lerp3(pp([.44,0,-.06]),w,ss(seg(t,39.6,40.2))),[.6,-1,-.2])}
  else rR=BipiRig.ikTip('R',pp([.44,.0,-.06]),polR);
  BipiRig.armPose('R',rR,pose);
  if(holdOn||true){pose.dedoR={s:.001}}
  // ---- braço que toca/acena
  const fg=finger(t); let lw;const idle=[-.62,.78,.36];
  let wave=0;[[1.2,4.9],[39.8,45]].forEach(a=>{wave=Math.max(wave,ss(seg(t,a[0],a[0]+.35))*(1-(a[1]>44?0:ss(seg(t,a[1]-.3,a[1])))))});
  const cheer=Math.max(ss(seg(t,13.6,13.9))*(1-ss(seg(t,14.4,14.7))),ss(seg(t,29.9,30.1))*(1-ss(seg(t,30.6,30.9))));
  let target=idle.slice();
  if(wave>0||cheer>0){const w=[-.82+Math.sin(t*10)*.12,2.0+Math.sin(t*10+1)*.06,.3];target=lerp3(target,w,Math.max(wave,cheer))}
  let rL;
  if(diving&&!retorno){rL=BipiRig.ik('L',[-.9,1.95+Math.sin(t*14+1)*.1,.25],[-.6,-1,-.2])}
  else if(fg&&fg.act>0){
    const tip=pp([fg.u*.33,fg.v*.715,.045+fg.lift/phoneS]);
    const r1=BipiRig.ikTip('L',tip,[-.4,-1,-.2]);
    const W=lerp3(target,r1.W,fg.act);rL=BipiRig.ik('L',W,[-.4,-1,-.2]);
  } else rL=BipiRig.ik('L',target,[-.4,-1,-.2]);
  BipiRig.armPose('L',rL,pose);
  // ---- rosto
  const blink=((t*1.0)%3.3)<.13?.12:1;pose.olhoL={sy:blink};pose.olhoR={sy:blink};
  const brow=talk?.012*Math.sin(t*12):0;pose.cejaL={ty:.205+brow+(fg?.012:0),rz:.08};pose.cejaR={ty:.205+brow+(fg?.012:0),rz:-.08};
  pose.boca={sy:Math.max(.0001,mo>.06?.12+mo*1.5:.0001)};pose.sorriso={s:mo>.06?.0001:1};
  const lookDown=fg&&fg.act>.5?.16:(m>.5?.1:.0);
  pose.cabeca={ty:1.98+Math.sin(t*3.2)*.015,rx:lookDown+(talk?Math.sin(t*5)*.03:0),ry:Math.sin(t*.9)*.08+(talk?Math.sin(t*3.3)*.04:0),rz:Math.sin(t*2.1)*.02};
  pose.antenaPivo={rz:Math.sin(t*5)*(talk?.09:.04)};
  pose.feixe={ty:-.02+Math.sin(t*3)*.07};
  // ---- câmera
  const cx=.12;
  let talkCam={eye:[.1,1.66,7.2],at:[.1,1.66,.3]}, demoCam={eye:[cx,.84,4.23],at:[cx,.84,.62]};
  const outro=ss(seg(t,39.4,40.2));
  talkCam={eye:[.1,lerp(1.85,2.49,outro),lerp(7.6,8.9,outro)],at:[.1,lerp(1.85,2.49,outro),.3]};
  const sh=t>5.8&&t<6.5?Math.sin((t-5.8)*40)*0:0;
  const cam={eye:lerp3(talkCam.eye,demoCam.eye,m),at:lerp3(talkCam.at,demoCam.at,m),fov:32};
  // flashes da tela
  let glow=0;[[6.3,.35],[13.8,.3],[26.9,.4],[29.6,.4]].forEach(a=>{const d=t-a[0];if(d>0&&d<a[1])glow=Math.max(glow,Math.sin(Math.PI*d/a[1])*.7)});
  const o={rotY,pos,scale,squash,pose,cam,screen:sc,screenGlow:glow,shadowA:.8,glow:{ledPeito:0}};
  if(phone)o.phone=phone; else if(false){}
  B.render(o);
};
