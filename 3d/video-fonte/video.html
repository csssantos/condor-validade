['tg_vinculado','tg_validade','tg_lote','tg_quantidade','tg_lancada'].forEach(n=>NAMES.push(n));
const IM={};const AV=new Image();AV.src='a/tg_avatar.png';const loads=[new Promise(r=>{AV.onload=r;AV.onerror=r}),...[...new Set(NAMES)].map(n=>new Promise(r=>{const im=new Image();im.onload=r;im.onerror=r;im.src='a/'+n+'.jpg';IM[n]=im}))];

function imgAt(i,t){const st=TL.seq[i][1];if(typeof st==='string')return st;const p=eio(seg(t,TL.seq[i][0],TL.seq[i][0]+st.d));return st.scroll+'_s'+String(Math.round(p*(st.n-1))).padStart(2,'0')}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function drawScreen(t){
  let i=0;for(let k=0;k<TL.seq.length;k++)if(t>=TL.seq[k][0])i=k;
  const cur=imgAt(i,t);

  TL.callouts.forEach(c=>{const a=Math.min(seg(t,c[0]-.05,c[0]+.2),1-seg(t,c[1]-.1,c[1]+.25));if(a>0&&imgAt(i,t)===c[2]){sx.globalAlpha=a;rr(sx,c[3]*2,SB+c[4]*2,c[5]*2,c[6]*2,22);sx.lineWidth=6;sx.strokeStyle='#E31E24';sx.stroke();sx.globalAlpha=1}});

  const s=TL.scan;if(t>s[0]&&t<s[1]+.25){const k=seg(t,s[0],s[1]);const y=SB+80+k*1500;sx.globalAlpha=1-seg(t,s[1],s[1]+.25);
    const g=sx.createLinearGradient(0,y-120,0,y+12);g.addColorStop(0,'rgba(227,30,36,0)');g.addColorStop(1,'rgba(227,30,36,.28)');sx.fillStyle=g;sx.fillRect(0,y-120,780,132);
    sx.fillStyle='#ff3b3f';sx.shadowColor='#ff2a2f';sx.shadowBlur=30;sx.fillRect(30,y,720,8);sx.shadowBlur=0;sx.globalAlpha=1}
  // toques
  TL.taps.forEach(a=>{const d=t-a[0];if(d>-.22&&d<.55){const X=a[1]*2,Y=SB+a[2]*2;
    const vis=d<0?ss(seg(d,-.22,-.05)):1-ss(seg(d,.25,.55));const pr=d>=0?Math.exp(-Math.pow(d/.08,2)):0;
    sx.globalAlpha=vis*.55;sx.fillStyle='#fff';sx.beginPath();sx.arc(X,Y,34*(1-.18*pr),0,6.283);sx.fill();
    sx.globalAlpha=vis*.8;sx.strokeStyle='rgba(11,79,158,.55)';sx.lineWidth=4;sx.stroke();
    if(d>0){const k=seg(d,0,.5);sx.globalAlpha=(1-k)*.7;sx.strokeStyle='#fff';sx.lineWidth=5;sx.beginPath();sx.arc(X,Y,34+70*eo(k),0,6.283);sx.stroke()}

    sx.globalAlpha=vis*.55;sx.fillStyle='#fff';sx.beginPath();sx.arc(X,Y,34,0,6.283);sx.fill();sx.globalAlpha=vis*.8;sx.strokeStyle='rgba(11,79,158,.55)';sx.lineWidth=4;sx.stroke();sx.globalAlpha=1}});

const CC=document.createElement('canvas');CC.width=780;CC.height=1762;const cx=CC.getContext('2d');

function wrap(g,txt,maxW){const out=[];txt.split('\n').forEach(par=>{if(!par){out.push('');return}let line='';par.split(' ').forEach(w=>{const tst=line?line+' '+w:w;if(g.measureText(tst).width>maxW&&line){out.push(line);line=w}else line=tst});out.push(line)});return out}
const HDR=150,INP=128,TOP=SB+HDR-SB; // cabeçalho começa após a barra de status
let CHAT=null;
function layoutChat(){
  cx.font='500 29px '+FONT;
  const msgs=[{from:'bot',t:-1,img:'tg_vinculado',text:'✅ Pronto, Ana! Seu Telegram está vinculado.\n\nAgora é só me mandar o código de barras ou o nome do produto.'}].concat(TL.chat.map(m=>m[0]==='me'?{from:'me',t:m[1],text:m[2]}:{from:'bot',t:m[1],img:'tg_'+m[2],text:m[3]}));
  let y=24;msgs.forEach(m=>{const maxW=m.from==='me'?470:520;const bw=m.from==='bot'?560:0;
    m.lines=wrap(cx,m.text,maxW);const tw=Math.max(...m.lines.map(l=>cx.measureText(l).width));
    m.w=m.from==='bot'?bw:Math.max(150,tw+200);m.imgH=m.from==='bot'?Math.round(560*510/960):0;
    m.h=m.imgH+(m.from==='bot'?24:18)+m.lines.length*38+(m.from==='bot'?34:18);m.y=y;y+=m.h+16});

}
function drawChat(t){
  if(!CHAT)layoutChat();const g=cx;const area=1762-SB-HDR-INP;
  // fundo
  const bg=g.createLinearGradient(0,0,780,1762);bg.addColorStop(0,'#cfe0c6');bg.addColorStop(1,'#a9c9a4');g.fillStyle=bg;g.fillRect(0,0,780,1762);
  g.globalAlpha=.08;g.fillStyle='#2d5a27';for(let i=0;i<70;i++){const x=(i*137)%780,y=(i*211)%1762;g.beginPath();g.arc(x,y,6+(i%4)*3,0,6.283);g.fill()}g.globalAlpha=1;
  // rolagem determinística
  const vis=CHAT.msgs.filter(m=>m.t<=t);let scroll=0;
  CHAT.msgs.forEach((m,i)=>{const bottom=m.y+m.h+40;const prevB=i?CHAT.msgs[i-1].y+CHAT.msgs[i-1].h+40:0;const tgt=Math.max(0,bottom-area),prev=Math.max(0,prevB-area);scroll+=(tgt-prev)*eo(seg(t,m.t,m.t+.38))});
  g.save();g.beginPath();g.rect(0,SB+HDR,780,area);g.clip();
  CHAT.msgs.forEach(m=>{if(m.t>t)return;const a=seg(t,m.t,m.t+.25);const off=(1-eo(a))*40;const y=SB+HDR+m.y-scroll+off;
    if(y>1762||y+m.h<SB+HDR)return;g.globalAlpha=clamp(a*1.6);
    const x=m.from==='me'?780-24-m.w:24;
    g.fillStyle=m.from==='me'?'#EFFDDE':'#fff';g.shadowColor='rgba(0,0,0,.12)';g.shadowBlur=6;g.shadowOffsetY=2;rr(g,x,y,m.w,m.h,26);g.fill();g.shadowBlur=0;g.shadowOffsetY=0;
    let ty=y;if(m.img){g.save();rr(g,x+6,y+6,m.w-12,m.imgH,22);g.clip();g.drawImage(IM[m.img],x+6,y+6,m.w-12,m.imgH);g.restore();ty+=m.imgH+6}
    g.fillStyle='#111';g.font='500 29px '+FONT;g.textBaseline='top';m.lines.forEach((l,k)=>g.fillText(l,x+(m.from==='me'?26:22),ty+(m.from==='bot'?18:16)+k*38));
    g.font='400 21px '+FONT;g.fillStyle=m.from==='me'?'#5aa25a':'#8a98a8';const hh=m.from==='me'?'19:02 ✓✓':'19:02';const tw=g.measureText(hh).width;g.fillText(hh,x+m.w-tw-18,y+m.h-32);
    g.globalAlpha=1});
  g.restore();
  // cabeçalho
  g.fillStyle='#517DA2';g.fillRect(0,0,780,SB+HDR);
  g.strokeStyle='#fff';g.lineWidth=5;g.lineCap='round';g.beginPath();g.moveTo(52,SB+52);g.lineTo(34,SB+75);g.lineTo(52,SB+98);g.stroke();
  g.save();g.beginPath();g.arc(124,SB+75,46,0,6.283);g.clip();g.drawImage(AV,78,SB+29,92,92);g.restore();
  g.fillStyle='#fff';g.font='700 33px '+FONT;g.fillText('Bipi · Condor Validade',190,SB+34);
  let typingBot=false;TL.chat.forEach((m,i)=>{if(m[0]==='bot'&&t>m[1]-.42&&t<m[1])typingBot=true});
  g.font='400 25px '+FONT;g.fillStyle='#d5e4f2';g.fillText(typingBot?'digitando'+'.'.repeat(1+Math.floor(t*6)%3):'bot',190,SB+82);
  g.fillStyle='#fff';[0,1,2].forEach(k=>{g.beginPath();g.arc(735,SB+56+k*19,4.5,0,6.283);g.fill()});
  // campo de mensagem
  const iy=1762-INP;g.fillStyle='#fff';g.fillRect(0,iy,780,INP);g.fillStyle='#e9eef2';g.fillRect(0,iy,780,2);
  let draft='',send=-9;TL.chat.forEach(m=>{if(m[0]==='me'){const st=m[1]-.5,en=m[1]-.1;if(t>=st&&t<m[1]){draft=m[2].slice(0,Math.ceil(m[2].length*seg(t,st,en)))}if(Math.abs(t-m[1])<.5)send=t-m[1]}});
  g.font='500 30px '+FONT;g.textBaseline='middle';
  if(draft){g.fillStyle='#111';g.fillText(draft,110,iy+INP/2);const w=g.measureText(draft).width;if(Math.floor(t*4)%2===0)g.fillRect(112+w,iy+INP/2-18,3,36)}

// ---------- celular (transformação) ----------
const DEV={x:430,y:384,w:560,h:1225,cx:710,cy:996.5};
let devT={dx:0,dy:0,s:1,rot:0,ry:0};
function phoneTf(t){
  const [a,b]=TL.phoneIn,[c,d]=TL.phoneOut;
  let dx=0,dy=0,rot=0,ry=0,s=1,op=1;
  if(t<a){op=0}

  if(t>=c){const k=seg(t,c,d);const e=ei(k);dx=e*900;rot=e*10;ry=e*20;op=1-seg(t,d-.15,d)}

  dy+=Math.sin(t*1.1)*5;
  TL.chapters.forEach(ch=>{if(t>=ch[0]&&t<ch[1]){s=1+.018*ss(seg(t,ch[0],ch[1]))}});
  return {dx,dy,s,rot,ry,op};
}
function mapRect(x,y,w,h){ // retângulo em unidades 390 -> px da página (sem rotação)
  const k=528/390;const px=DEV.x+16+x*k,py=DEV.y+16+SB*528/780+y*k;
  const m=(X,Y)=>[DEV.cx+(X-DEV.cx)*devT.s+devT.dx,DEV.cy+(Y-DEV.cy)*devT.s+devT.dy];
  const p0=m(px,py),p1=m(px+w*k,py+h*k);return [p0[0],p0[1],p1[0]-p0[0],p1[1]-p0[1]];
}
// ---------- chamadas (zoom) ----------
const COS=TL.callouts.map(c=>{const el=document.createElement('div');el.className='co';
  const W=620,H=Math.round(W*c[6]/c[5]);

  $('cos').appendChild(el);return {c,el,W,H,cv:el.querySelector('canvas'),lab:el.querySelector('.lab'),drawn:false}});
function drawCallouts(t){
  COS.forEach(o=>{const c=o.c;const vin=seg(t,c[0],c[0]+.55),vout=seg(t,c[1]-.05,c[1]+.4);

// ---------- textos ----------
function words(s){return s.split(' ').map(w=>({w:w.replace(/\*/g,''),em:false}))}
function emWords(s){let on=false;return s.split(' ').map(w=>{const st=w.startsWith('*');if(st)on=true;const r={w:w.replace(/\*/g,''),em:on};if(w.endsWith('*'))on=false;return r})}
let titleIdx=-2;
function setTitle(i){if(i===titleIdx)return;titleIdx=i;if(i<0){$('title').innerHTML='';return}
  $('title').innerHTML=TL.chapters[i][3].split('|').map(l=>'<div>'+emWords(l).map(o=>`<span>${o.em?'<b>'+o.w+'</b>':o.w}</span>`).join('')+'</div>').join('');
  $('tagt').textContent=TL.chapters[i][2];[...document.querySelectorAll('#tag .bars i')].forEach((b,k)=>b.className=k<=i?'on':'')}
let bubIdx=-2;
function bubbleHTML(s,n){ // primeiros n caracteres (sem asteriscos), com negrito
  let out='',cnt=0,on=false;for(const ch of s){if(ch==='*'){on=!on;out+=on?'<b>':'</b>';continue}if(cnt>=n)break;out+=ch;cnt++}if(on)out+='</b>';return out}
const plain=s=>s.replace(/\*/g,'');

function drawBubble(t,place){

  const cfg=place==='center'?{cx:540,bottom:790,max:720,al:'center'}:place==='corner'?{x:24,bottom:1428,max:400,al:'left'}:{cx:540,bottom:1075,max:720,al:'center'};

  const a=seg(t,b[0],b[0]+.3),z=1-seg(t,b[1],b[1]+.3);el.style.opacity=Math.min(a,z);

// ---------- Bipi ----------
let B;
const bin=Uint8Array.from(atob(BIPI_GLB),c=>c.charCodeAt(0)).buffer;
Promise.all([Bipi3D.create($('gl'),bin),...loads]).then(([b])=>{B=b;window.ready=true});
const SPOT={center:{x:90,y:760,s:1},corner:{x:-46,y:1407,s:.58},outro:{x:180,y:1040,s:.78}};
function bipiSpot(t){
  const [c0,c1]=TL.toCorner,[o0,o1]=TL.toOutro;let A=SPOT.center,Bp=SPOT.center,k=0;
  if(t>=c0&&t<o0){A=SPOT.center;Bp=SPOT.corner;k=eio(seg(t,c0,c1))}
  else if(t>=o0){A=SPOT.corner;Bp=SPOT.outro;k=eio(seg(t,o0,o1))}
  // arco ao trocar de lugar
  const arc=Math.sin(Math.PI*k)*-90;
  return {x:lerp(A.x,Bp.x,k),y:lerp(A.y,Bp.y,k)+arc,s:lerp(A.s,Bp.s,k),k};
}
function place(t){if(t<TL.toCorner[0]+.4)return 'center';if(t<TL.toOutro[0]+.5)return 'corner';return 'outro'}
function mouthAt(t){if(!bubState.typing)return 0;const v=Math.abs(Math.sin(t*15.5))*(.55+.45*Math.abs(Math.sin(t*4.3+1)));return v}
window.frame=function(t){
  if(!B)return;

  $('b1').style.transform=`translate(${Math.sin(t*.35)*40}px,${Math.cos(t*.3)*30}px)`;$('b2').style.transform=`translate(${Math.cos(t*.25)*40}px,${Math.sin(t*.32)*30}px)`;
  bubs.forEach(b=>{const y=1980-((t*b.sp+b.ph*260)%2100);b.d.style.transform=`translate(${b.x+Math.sin(t*.6+b.ph)*20}px,${y}px)`});
  // gancho
  const hk=[...$('h1').children,...$('h2').children];
  hk.forEach((s,i)=>{const t0=i<6?.25+i*.11:1.65+(i-6)*.16;const p=seg(t,t0,t0+.5);s.style.opacity=clamp(p*2.2);s.style.transform=`translateY(${(1-eq(p))*70}px)`});
  const hout=seg(t,3.25,3.75);$('hook').style.opacity=1-hout;$('hook').style.transform=`translateY(${-eio(hout)*120}px) scale(${1-.04*hout})`;
  const red=$('h2').querySelector('.red');red.style.transform+=` scale(${1+.06*Math.exp(-Math.pow((t-2.2)/.12,2))})`;
  $('brand').style.opacity=Math.min(seg(t,3.6,4.1),1-seg(t,38.1,38.5))*.95;
  // título do capítulo
  let ci=-1;TL.chapters.forEach((c,i)=>{if(t>=c[0]&&t<c[1])ci=i});setTitle(ci);
  if(ci>=0){const c=TL.chapters[ci];const lt=t-c[0];const sp=$('title').querySelectorAll('span');
    for(let k=0;k<sp.length;k++){const p=seg(lt,.08+k*.06,.55+k*.06);sp[k].style.opacity=clamp(p*2);sp[k].style.transform=`translateY(${(1-eq(p))*44}px)`}
    const out=seg(t,c[1]-.35,c[1]);$('title').style.opacity=1-out;$('title').style.transform=`translateY(${-out*30}px)`;
    $('tag').style.opacity=Math.min(seg(lt,0,.3),ci===3?1-seg(t,c[1]-.35,c[1]):1);
  } else {$('title').style.opacity=0;$('tag').style.opacity=0}
  // celular
  const P=phoneTf(t);devT=P;$('dev').style.opacity=P.op;
  $('dev').style.transform=`translate(${P.dx}px,${P.dy}px) perspective(2400px) rotateY(${P.ry}deg) rotate(${P.rot}deg) scale(${P.s})`;
  if(P.op>0)drawScreen(t);
  drawCallouts(t);
  // validade lançada
  const sv=TL.saved;const sa=Math.min(seg(t,sv[0],sv[0]+.3),1-seg(t,sv[1]-.25,sv[1]));$('saved').style.opacity=sa;$('saved').style.transform=`translateY(${(1-ob(seg(t,sv[0],sv[0]+.45),1.5))*40}px) scale(${.85+.15*ob(seg(t,sv[0],sv[0]+.45),1.5)})`;
  // Telegram
  TL.banners.forEach((b,i)=>{const el=$('ban'+i);const a=seg(t,b[0],b[0]+.55),z=seg(t,b[1]-.35,b[1]);el.style.opacity=Math.min(clamp(a*3),1-z);
    const top=i?800:470;el.style.top=top+'px';el.style.transform=`translateX(${(1-eq(a))*-700+z*-60}px) rotate(${(1-eq(a))*-8+(i?1.5:-1.5)}deg)`});
  $('tgl').style.opacity=Math.min(seg(t,TL.telegram[0],TL.telegram[0]+.35),1-seg(t,TL.telegram[1]-.35,TL.telegram[1]));$('tgl').style.transform=`translateY(${(1-eo(seg(t,TL.telegram[0],TL.telegram[0]+.4)))*20}px)`;
  // final
  $('outro').style.opacity=seg(t,TL.logo-.2,TL.logo+.3);
  $('lg').style.transform=`translateY(${(1-ob(seg(t,TL.logo,TL.logo+.7),1.3))*90}px) scale(${.9+.1*eq(seg(t,TL.logo,TL.logo+.6))})`;
  [['o1',.35],['o2',.55],['o3',1.0]].forEach(([id,d])=>{const p=seg(t,TL.logo+d,TL.logo+d+.5);$(id).style.opacity=p;$(id).style.transform=`translateY(${(1-eq(p))*40}px)`});
  const cp=seg(t,TL.logo+2.2,TL.logo+2.7);$('cta').style.opacity=cp;$('cta').style.transform=`translateX(-50%) translateY(${(1-ob(cp,1.6))*40}px)`;
  // balão
  const pl=place(t);drawBubble(t,pl);
  // ---- Bipi
  const sp=bipiSpot(t);let visible=t>=TL.bipiIn;
  let rise=1;if(t<TL.bipiIn+.75){rise=ob(seg(t,TL.bipiIn,TL.bipiIn+.7),1.6)}
  const gl=$('gl');gl.style.opacity=visible?1:0;
  gl.style.transform=`translate(${sp.x}px,${sp.y+(1-rise)*700}px) scale(${sp.s})`;
  if(!visible){return}
  const pose={dedoL:{s:.001},dedoR:{s:.001},polegarL:{s:.001},polegarR:{s:.001}};

  let rotY=face+Math.sin(t*.8)*.05;let pos=[0,Math.abs(Math.sin(t*2.6))*.015,0];
